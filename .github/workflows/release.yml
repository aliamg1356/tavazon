name: release

# Triggered by pushing a tag like `release-1.0.0`.
# The version baked into the binary is the tag with the `release-` prefix stripped
# (e.g. `release-1.0.0` -> `1.0.0`). A manual run (workflow_dispatch) builds all
# artifacts and the Docker image for testing but publishes nothing.
#
# Docker Hub needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.osname }}/${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux
          - { goos: linux,   osname: linux,   goarch: amd64, label: x86_64 }
          - { goos: linux,   osname: linux,   goarch: arm64, label: arm64 }
          - { goos: linux,   osname: linux,   goarch: arm,   goarm: '7', label: armv7 }
          # macOS (darwin) — Go has no 32-bit ARM target for darwin
          - { goos: darwin,  osname: macos,   goarch: amd64, label: x86_64 }
          - { goos: darwin,  osname: macos,   goarch: arm64, label: arm64 }
          # windows — Go 1.26 removed the 32-bit windows/arm port
          - { goos: windows, osname: windows, goarch: amd64, label: x86_64 }
          - { goos: windows, osname: windows, goarch: arm64, label: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#release-}" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          BIN=tavazon
          [ "$GOOS" = windows ] && BIN=tavazon.exe
          mkdir -p build
          go build -trimpath -mod=vendor \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "build/$BIN" ./cmd/tavazon

      - name: Package
        run: |
          set -euo pipefail
          NAME="tavazon-${VERSION}-${{ matrix.osname }}-${{ matrix.label }}"
          STAGE="dist/$NAME"
          mkdir -p "$STAGE"
          cp build/tavazon* "$STAGE"/
          cp README.md LICENSE config.example.json "$STAGE"/
          cp systemd/tavazon.service "$STAGE"/
          mkdir -p out
          if [ "${{ matrix.goos }}" = windows ]; then
            (cd dist && zip -r "../out/$NAME.zip" "$NAME")
          else
            tar -C dist -czf "out/$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tavazon-${{ env.VERSION }}-${{ matrix.osname }}-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  docker:
    name: docker image
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/s4l3h1/tavazon
      PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#release-}" >> "$GITHUB_ENV"

      # Tag release-1.3.2 -> 1.3.2, 1.3, 1, latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=match,pattern=release-(\d+\.\d+\.\d+),group=1
            type=match,pattern=release-(\d+\.\d+)\.\d+,group=1
            type=match,pattern=release-(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/release-') }}

      # Run every platform's image under QEMU before anything is pushed: the
      # binary is UPX-packed, so this proves it still unpacks and starts. The
      # builds also warm the builder cache for the push below.
      - name: Smoke test
        run: |
          set -euo pipefail
          for p in ${PLATFORMS//,/ }; do
            docker buildx build --platform "$p" --build-arg VERSION="$VERSION" \
              --load -t tavazon:smoke .
            out=$(docker run --rm --platform "$p" tavazon:smoke -version)
            echo "$p: $out"
            [ "$out" = "tavazon $VERSION" ]
          done

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/release-')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: VERSION=${{ env.VERSION }}
          push: ${{ startsWith(github.ref, 'refs/tags/release-') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: publish release
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
